name: secret-scan
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  call:
    uses: vladm3105/aidoc-flow-ci/.github/workflows/secret-scan.yml@ci/v1.9.5
    with:
      # Use this repo's tuned allowlist (detect-secrets baseline + IPLANIC
      # conformance test vectors). Without it the reusable's default allowlist
      # misses the compound dir name `iplanic-vectors/` (its pattern only
      # matches a bare `vectors/`) and fails on the placeholder HMAC key.
      config-path: .gitleaks.toml
