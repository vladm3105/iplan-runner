# standards-drift — weekly server-side canon drift check.
#
# Runs `bash sync/check-standards-drift.sh --tier product` (product-code
# tier). Script is fetched from aidoc-flow-ci canon at ci/v1.6.0 at
# runtime (not checked-in).
#
# WARNING-ONLY per canon §3.1b — the script always exits 0.

name: standards-drift

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  drift:
    name: check-standards-drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fetch drift-check script from aidoc-flow-ci canon
        run: |
          mkdir -p sync
          curl -fsSL "https://raw.githubusercontent.com/vladm3105/aidoc-flow-ci/ci/v1.6.0/sync/check-standards-drift.sh" -o sync/check-standards-drift.sh
          chmod +x sync/check-standards-drift.sh

      - name: Run standards drift check (tier=product)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash sync/check-standards-drift.sh --tier product
